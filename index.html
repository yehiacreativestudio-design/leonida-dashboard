<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d1f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leonida">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Leonida Uncut</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Luckiest+Guy&family=Poppins:wght@800&display=swap">
<style>
:root{--bg:#0d1f24;--panel:#15303a;--panel2:#1b3b46;--line:#335560;--text:#f1f4ec;--mute:#a9c1bd;
  --teal:#7fe0d2;--gold:#ffd58a;--red:#ff7b6b;--green:#8fe39a;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
a{color:var(--teal)}
header{position:sticky;top:0;z-index:5;background:#0d1f24f2;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.08em;font-size:13px;color:var(--gold)}
.who{margin-left:auto;color:var(--mute);font-size:13px;display:flex;gap:10px;align-items:center}
nav{max-width:1100px;margin:auto;padding:0 10px;display:flex;gap:2px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:12px 16px;font:inherit;font-weight:650;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav button.on{color:var(--text);border-color:var(--teal)}
nav .n{display:inline-block;min-width:22px;padding:0 7px;border-radius:11px;background:var(--panel2);color:var(--text);font-size:12.5px;line-height:22px;text-align:center;font-variant-numeric:tabular-nums}
nav .n.hot{background:var(--red);color:#1a0b08}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.todo{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:10px}
.todo .big{font-size:32px;font-weight:800;min-width:46px;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.todo .what{flex:1;min-width:0}.todo .what b{display:block;font-size:16.5px}.todo .what span{color:var(--mute);font-size:14px}
.todo.urgent{border-color:var(--red);background:#2b1d1c}.todo.urgent .big{color:var(--red)}
.callout{border:1px solid #6a5a2c;background:#2a2819;color:var(--text);padding:10px 12px;border-radius:9px;margin:10px 0;font-size:14.5px}
.callout.danger{border-color:#7a3a33;background:#2e1c1a}
.callout b{display:block;margin-bottom:2px}.callout ul{margin:4px 0 0;padding-left:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel2);font-size:13px;font-weight:650;margin:0 6px 6px 0}
.chip.ok{color:var(--green)}.chip.wait{color:var(--gold)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute);flex:none}.dot.on{background:var(--green)}.dot.warn{background:var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
button.b.big{padding:11px 20px;font-size:16px}
button.b.danger-ghost{background:none;color:var(--red);border:1px solid #6b3a34}
.clip{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.clip video{width:250px}
.menu{display:grid;gap:8px}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--text);font:inherit;cursor:pointer}
.menu button b{display:block}.menu button span.d{color:var(--mute);font-size:14px}.menu button .go{color:var(--mute);font-size:20px}
.back{background:none;border:0;color:var(--teal);font:inherit;font-weight:650;padding:6px 0;cursor:pointer}
.lede{color:var(--mute);margin:-6px 0 14px;max-width:62ch}
main{max-width:1100px;margin:auto;padding:18px 16px 60px}
h1{font-size:26px;letter-spacing:-.02em;margin:6px 0 14px}
h2{font-size:17px;margin:22px 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{color:var(--mute);font-size:13px}
.stat.alarm{border-color:var(--red)} .stat.alarm b{color:var(--red)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.grow{flex:1;min-width:240px}
video{width:230px;max-width:100%;border-radius:10px;background:#000;aspect-ratio:9/16}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tag.ok{background:#1f4a35;color:var(--green)} .tag.warn{background:#4a3f1f;color:var(--gold)} .tag.bad{background:#4a2520;color:var(--red)}
.mute{color:var(--mute)} .small{font-size:13px} .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere}
button.b,a.b{display:inline-block;background:var(--teal);color:#06231f;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
button.b.ghost,a.b.ghost{background:none;color:var(--teal);border:1px solid var(--line)}
button.b.danger{background:var(--red);color:#1a0b08}
button.b:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{width:100%;background:#0b1a1e;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12.5px}
.tablewrap{overflow-x:auto}
.count{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--red);line-height:1}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;padding:10px 0 10px 40px;position:relative;border-top:1px solid var(--line)}
.steps li:before{content:counter(s);position:absolute;left:0;top:10px;width:26px;height:26px;border-radius:50%;background:var(--panel2);text-align:center;font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#06231f;border:1px solid var(--teal);color:var(--text);padding:10px 16px;border-radius:10px;max-width:92vw;display:none;z-index:9}
#toast.err{border-color:var(--red)}
.login{max-width:380px;margin:9vh auto;padding:0 16px}
.hide{display:none}
.switch{min-width:64px}
.phone{width:270px;height:480px;border-radius:18px;overflow:hidden;position:relative;border:1px solid var(--line);background:#0a1418}
.phone .cam{position:absolute;left:0;right:0;top:0;background:linear-gradient(135deg,#3b2a4a,#1d2f45);display:flex;align-items:center;justify-content:center;color:#ffffff66;font-size:12px}
.phone .game{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(160deg,#1f4a3a,#14303a 60%,#3a2f1f);display:flex;align-items:center;justify-content:center;color:#ffffff55;font-size:12px}
.phone .cap{position:absolute;left:0;right:0;text-align:center;transform:translateY(-50%);line-height:1.1;paint-order:stroke fill;white-space:nowrap}
.field{min-width:150px;flex:1}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}.check input{width:auto}
header{padding-top:env(safe-area-inset-top)}
main{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
@media (max-width:640px){
  body{font-size:16px}
  h1{font-size:22px}
  .bar{padding:10px 12px}.bar #fresh{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:none;background:#0d1f24fa;border-top:1px solid var(--line);border-bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
  nav button{flex:1;justify-content:center;border-bottom:0;border-radius:10px;padding:11px 4px;font-size:14.5px}
  nav button.on{background:var(--panel2)}
  .clip{grid-template-columns:1fr}.clip video{width:100%}
  textarea{min-height:112px}
  .actions .b{flex:1 1 100%;text-align:center}
  .todo{padding:14px;gap:8px 12px;flex-wrap:wrap}.todo .what{flex:1 1 55%}.todo .b{flex:1 1 100%;text-align:center;padding:12px 14px}
  .todo .big{min-width:0;font-size:30px}
  main{padding:14px 12px calc(80px + env(safe-area-inset-bottom))}
  .card{padding:12px 13px}
  button.b,a.b{padding:12px 16px;font-size:16px}                 /* thumb-sized */
  input,textarea,select{font-size:16px;padding:11px 12px}        /* 16px stops iOS zooming in on focus */
  video{width:100%;max-height:70vh}
  .row{gap:10px}.grow,.field{min-width:100%}
  .row > div[style*="width:"]{width:100% !important}
  .count{font-size:56px}
  th,td{padding:7px 6px}
  .phone{margin:auto}
  #toast{bottom:calc(78px + env(safe-area-inset-bottom));width:92vw;text-align:center}   /* clear of the bottom bar */
}
</style>
</head>
<body>
<div id="login" class="login hide">
  <div class="brand">LEONIDA UNCUT</div>
  <h1>Sign in</h1>
  <form id="loginForm" class="card">
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
    <p><button class="b" type="submit">Sign in</button> <button class="b ghost" type="button" id="signup">First time: create my login</button></p>
    <p id="loginMsg" class="small mute"></p>
    <p class="small mute">Only invited partner emails get access. Choose your own password; nobody else sees it.</p>
  </form>
</div>

<div id="setup" class="login hide">
  <div class="brand">LEONIDA UNCUT</div>
  <h1>Not connected yet</h1>
  <p class="card">This dashboard has no database address. <code>dashboard/config.js</code> needs the Supabase project URL and publishable key.</p>
</div>

<div id="app" class="hide">
  <header>
    <div class="bar"><span class="brand">LEONIDA UNCUT</span>
      <span class="who"><span id="agentDot" class="dot" aria-hidden="true"></span><span id="agentLine" class="small"></span><span id="fresh" class="small mute"></span></span></div>
  </header>
  <nav id="nav" aria-label="Main"></nav>
  <main id="view"></main>
</div>
<div id="toast"></div>

<script>
"use strict";
const cfg = window.LEONIDA || {};
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https:\/\//i.test(u || "") ? esc(u) : "#";
const money = v => v == null ? "—" : "$" + Number(v).toFixed(2);
const num = v => v == null ? "—" : Number(v).toLocaleString();
const when = t => t ? new Date(t).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "—";
const TABS = [["home", "Home"], ["review", "Review"], ["post", "Post"], ["more", "More"]];
const MORE = [["make", "Make clips", "Paste a clip or stream link, or upload a video"],
              ["style", "Caption style", "Font, size, colours and position for new clips"],
              ["agents", "Agents", "See what is running and switch agents on or off"],
              ["campaigns", "Campaigns and streamers", "Terms, deadlines and who you may clip"],
              ["earnings", "Earnings", "Views, estimates and money received per post"],
              ["queue", "To-do list", "Jobs for people and for the agents"],
              ["history", "History", "Every change and who made it"]];
const PLATFORM = {youtube: "YouTube", tiktok: "TikTok"};
const STYLE_DEFAULT = {font: "Anton", size: 112, color: "#FFFFFF", highlight: "#FFE14D", word_highlight: true, stroke: "#000000",
  stroke_width: 0.10, uppercase: true, max_words: 3, position: "seam", webcam_share: 0.36, show_disclosure: true, mask_strong_language: false};
const FONT_CSS = {"Anton": "Anton", "Bangers": "Bangers", "Bebas Neue": "'Bebas Neue'", "Poppins": "Poppins", "Luckiest Guy": "'Luckiest Guy'"};
let redoOpen = false;
const canShareFiles = (() => { try { return !!navigator.canShare && navigator.canShare({files: [new File([""], "a.mp4", {type: "video/mp4"})]}); } catch { return false; } })();
const videoFiles = {};          // storage path -> File, fetched ahead so sharing happens on the tap itself
const UPLOAD = {youtube: "https://studio.youtube.com/", tiktok: "https://www.tiktok.com/tiktokstudio/upload"};
let db, me = null, tab = "home", S = {posts: [], jobs: [], agents: [], campaigns: [], snaps: [], events: [], partners: [], channels: [], style: null};
const videoUrls = {};

function toast(msg, isErr) {
  const t = $("#toast"); t.textContent = msg; t.className = isErr ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", isErr ? 9000 : 3500);
}
async function call(promise, okMsg) {
  const {data, error} = await promise;
  if (error) { toast(error.message || String(error), true); return null; }
  if (okMsg) toast(okMsg);
  await load();
  return data ?? true;
}

async function start() {
  if (!cfg.url || !cfg.key) { $("#setup").classList.remove("hide"); return; }
  db = window.supabase.createClient(cfg.url, cfg.key);
  const {data} = await db.auth.getSession();
  db.auth.onAuthStateChange((_e, session) => { if (!session) showLogin(); });
  data.session ? enter(data.session) : showLogin();
}
function showLogin() { $("#app").classList.add("hide"); $("#login").classList.remove("hide"); }
async function enter(session) {
  const {data: rows, error} = await db.from("partners").select("id,display_name,kind").eq("id", session.user.id);
  if (error || !rows.length) {
    showLogin();
    $("#loginMsg").textContent = "Signed in, but this account is not a partner yet. The project owner adds partners in the database.";
    return;
  }
  me = rows[0];
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  $("#whoami").textContent = me.display_name;
  await load();
  setInterval(() => { if (document.visibilityState === "visible" && tab !== "style" && !redoOpen && !document.activeElement.matches("input,textarea,select")) load(); }, 20000);
  setInterval(tick, 1000);
}

async function load() {
  const q = [
    db.from("post_status").select("*").order("updated_at", {ascending: false}),
    db.from("jobs").select("*").in("state", ["queued", "claimed"]).order("priority", {ascending: false}).order("created_at"),
    db.from("agents").select("*").order("name"),
    db.from("campaigns").select("*").order("created_at"),
    db.from("campaign_snapshots").select("*").order("at", {ascending: false}).limit(20),
    db.from("events").select("id,at,actor,entity,action,after,before").order("id", {ascending: false}).limit(60),
    db.from("partners").select("id,display_name,kind"),
    db.from("channels").select("*").eq("active", true),
    db.from("settings").select("value").eq("key", "style"),
  ];
  const r = await Promise.all(q);
  const bad = r.find(x => x.error);
  if (bad) { toast(bad.error.message, true); return; }
  [S.posts, S.jobs, S.agents, S.campaigns, S.snaps, S.events, S.partners, S.channels] = r.map(x => x.data);
  S.style = Object.assign({}, STYLE_DEFAULT, (r[8].data[0] || {}).value || {});
  $("#fresh").textContent = "Updated " + new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  render();
}

const live = p => p.state === "published" && !p.submission_id && !p.window_missed;
const groups = () => ({
  review: S.posts.filter(p => ["draft", "in_review"].includes(p.state)),
  ready: S.posts.filter(p => p.state === "approved"),
  submitNow: S.posts.filter(live),
  missed: S.posts.filter(p => p.window_missed),
  submitted: S.posts.filter(p => ["submitted", "accepted"].includes(p.state)),
});
const name = id => (S.partners.find(p => p.id === id) || {}).display_name || (id ? "someone" : "system");

// One clip is posted to several platforms; people think in clips, so group the posts.
function clipGroups() {
  const map = new Map();
  for (const p of S.posts) {
    if (!["draft", "in_review", "approved"].includes(p.state)) continue;
    if (!map.has(p.clip)) map.set(p.clip, {clip: p.clip, first: p, posts: []});
    map.get(p.clip).posts.push(p);
  }
  return [...map.values()].map(c => Object.assign(c, {waiting: c.posts.filter(p => p.state !== "approved"), approved: c.posts.filter(p => p.state === "approved")}));
}
function reviewJob(clip) { return S.jobs.find(j => j.kind === "review" && j.payload && j.payload.clip === clip); }
function warningsFor(clip) { const j = reviewJob(clip); return (j && j.payload.quality && j.payload.quality.warnings) || []; }
const serious = w => /explicit|slur|nudity/i.test(w);

function agentStatus() {
  if (!S.agents.length) return {cls: "", text: "No agents set up", detail: ""};
  const working = S.agents.find(a => a.enabled && /^working/.test(a.last_status || "") && a.last_seen_at && Date.now() - new Date(a.last_seen_at) < 3 * 3600e3);
  if (working) return {cls: "on", text: "Agents are running", detail: working.name[0].toUpperCase() + working.name.slice(1) + " is working on: " + working.last_status.replace(/^working: /, "")};
  const seen = S.agents.filter(a => a.last_seen_at).map(a => +new Date(a.last_seen_at));
  const latest = seen.length ? Math.max(...seen) : 0;
  if (latest && Date.now() - latest < 4 * 60e3) return {cls: "on", text: "Agents are running", detail: "Waiting for work on " + ((S.agents.find(a => a.last_host) || {}).last_host || "a laptop") + "."};
  return {cls: "warn", text: "Agents are not running", detail: latest ? "Last seen " + when(latest) + ". No new clips will be made until they are started on a laptop." : "They have never run. Start them on a laptop to make clips."};
}

function render() {
  const g = groups(), cg = clipGroups(), toReview = cg.filter(c => c.waiting.length).length;
  const counts = {review: toReview, post: g.ready.length + g.submitNow.length};
  const primary = TABS.some(t => t[0] === tab) ? tab : "more";
  $("#nav").innerHTML = TABS.map(([id, label]) =>
    `<button data-tab="${id}" class="${id === primary ? "on" : ""}" ${id === primary ? 'aria-current="page"' : ""}>${label}${counts[id] ? `<span class="n ${id === "post" && g.submitNow.length ? "hot" : ""}">${counts[id]}</span>` : ""}</button>`).join("");
  const st = agentStatus();
  $("#agentDot").className = "dot " + st.cls; $("#agentLine").textContent = st.text;
  const back = MORE.some(m => m[0] === tab) ? `<button class="back" data-tab="more">‹ More</button>` : "";
  $("#view").innerHTML = back + VIEWS[tab](g, cg);
  if (tab === "review") loadVideos();
  if (tab === "style") drawPreview();
  tick();
}

function countdown(deadline) {
  const s = Math.floor((new Date(deadline) - Date.now()) / 1000);
  if (s <= 0) return "0:00";
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function tick() { document.querySelectorAll("[data-deadline]").forEach(el => el.textContent = countdown(el.dataset.deadline)); }

const VIEWS = {
  home(g, cg) {
    const toReview = cg.filter(c => c.waiting.length), st = agentStatus();
    const making = S.jobs.filter(j => ["analyze", "render"].includes(j.kind));
    const sum = k => S.posts.reduce((a, p) => a + Number(p[k] || 0), 0);
    const cam = S.campaigns.find(c => c.status === "active");
    const days = cam && cam.closes_at ? Math.max(0, Math.ceil((new Date(cam.closes_at) - Date.now()) / 864e5)) : null;
    const todo = [];
    if (g.submitNow.length) todo.push(`<div class="todo urgent"><div class="big" data-deadline="${esc(g.submitNow[0].submit_deadline)}"></div>
      <div class="what"><b>Submit your ${esc(PLATFORM[g.submitNow[0].platform] || g.submitNow[0].platform)} post to the campaign</b><span>It is public. It only earns if you submit before the clock runs out.</span></div>
      <button class="b" data-tab="post">Submit now</button></div>`);
    if (toReview.length) todo.push(`<div class="todo"><div class="big">${toReview.length}</div>
      <div class="what"><b>${toReview.length === 1 ? "clip to review" : "clips to review"}</b><span>Watch each one, then approve or skip it.</span></div>
      <button class="b" data-tab="review">Review</button></div>`);
    if (g.ready.length) todo.push(`<div class="todo"><div class="big">${g.ready.length}</div>
      <div class="what"><b>ready to post</b><span>Approved. Post one at a time and submit each straight away.</span></div>
      <button class="b" data-tab="post">Post</button></div>`);
    return `<h1>What needs you</h1>
    ${todo.join("") || `<div class="todo"><div class="what"><b>You are all caught up</b><span>${making.length ? "The agents are making " + making.length + " more clip" + (making.length === 1 ? "" : "s") + "." : "Nothing is waiting for you."}</span></div>
      <button class="b ghost" data-tab="make">Make clips</button></div>`}
    <h2>Agents</h2>
    <div class="todo"><span class="dot ${st.cls}" aria-hidden="true"></span><div class="what"><b>${esc(st.text)}</b><span>${esc(st.detail)}</span></div>
      <button class="b ghost" data-tab="agents">Details</button></div>
    ${making.length ? `<div class="card small"><b>In the works</b><ul style="margin:6px 0 0;padding-left:18px">${making.slice(0, 4).map(j => `<li>${esc(j.title)}</li>`).join("")}${making.length > 4 ? `<li class="mute">and ${making.length - 4} more</li>` : ""}</ul></div>` : ""}
    <h2>So far</h2>
    <div class="grid">
      <div class="card stat"><b>${g.submitted.length}</b><span>posts submitted to a campaign</span></div>
      <div class="card stat"><b>${money(sum("approved_usd"))}</b><span>approved by campaigns</span></div>
      <div class="card stat"><b>${money(sum("paid_usd"))}</b><span>received</span></div>
      ${cam ? `<div class="card stat"><b>${days ?? "—"}</b><span>days left in ${esc(cam.name)}</span></div>` : ""}
    </div>
    ${g.missed.length ? `<p class="small mute">${g.missed.length} post${g.missed.length === 1 ? "" : "s"} missed the submission window and cannot earn. Details are under Post.</p>` : ""}`;
  },

  review(g, cg) {
    const waiting = cg.filter(c => c.waiting.length), done = cg.filter(c => !c.waiting.length);
    if (!waiting.length && !done.length) return `<h1>Review</h1><div class="todo"><div class="what"><b>No clips to review</b><span>New clips appear here when the agents finish one.</span></div><button class="b ghost" data-tab="make">Make clips</button></div>`;
    const card = c => {
      const p = c.first, warn = warningsFor(c.clip), bad = warn.filter(serious), mild = warn.filter(w => !serious(w));
      const missing = [...new Set(c.posts.flatMap(x => x.caption_missing || []))];
      const job = reviewJob(c.clip), hook = job && job.title.includes(": ") ? job.title.slice(job.title.indexOf(": ") + 2) : "";
      const approved = !c.waiting.length;
      return `<div class="card" style="margin-bottom:14px"><div class="clip">
        <div><video controls playsinline preload="metadata" data-media="${esc(p.media_path || "")}"></video><div class="small mute" data-medianote></div></div>
        <div>
          ${hook ? `<b style="font-size:17px">${esc(hook)}</b>` : ""}
          <div class="small mute" style="margin:2px 0 8px">${p.duration_seconds ? Math.round(p.duration_seconds) + " seconds · " : ""}${esc(p.campaign_name)}</div>
          <div>${c.posts.map(x => `<span class="chip ${x.state === "approved" ? "ok" : "wait"}">${esc(PLATFORM[x.platform] || x.platform)} · ${x.state === "approved" ? "approved" : "waiting"}</span>`).join("")}</div>
          ${bad.length ? `<div class="callout danger"><b>Think twice before posting this</b><ul>${bad.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
          ${mild.length ? `<div class="callout"><b>Check before approving</b><ul>${mild.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
          <label for="cap-${esc(c.clip)}">Post caption</label>
          <textarea id="cap-${esc(c.clip)}" data-caption="${esc(c.clip)}" ${approved ? "readonly" : ""}>${esc(p.caption)}</textarea>
          ${missing.length ? `<p class="small" style="color:var(--red);margin:6px 0 0">The campaign requires this text in the caption: ${missing.map(esc).join(", ")}</p>` : ""}
          ${approved ? `<div class="actions"><span class="small">Approved for every platform.</span><button class="b" data-tab="post">Go to Post</button></div>` : `
          <div class="actions">
            <button class="b big" data-act="approveClip" data-clip="${esc(c.clip)}" ${me.kind !== "human" || missing.length ? "disabled" : ""}>Approve</button>
            <button class="b ghost" data-act="saveCaption" data-clip="${esc(c.clip)}">Save caption</button>
            <button class="b ghost" data-act="openRedo" data-clip="${esc(c.clip)}">Fix on-screen words or look</button>
            <button class="b danger-ghost" data-act="skipClip" data-clip="${esc(c.clip)}">Skip this clip</button>
          </div>
          <p class="small mute" style="margin-bottom:0">Watch it to the end first. The on-screen words are machine-made and can be wrong.</p>`}
          <div data-redo="${esc(c.clip)}"></div>
        </div></div></div>`;
    };
    return `<h1>Review</h1>${waiting.length ? `<p class="lede">${waiting.length} ${waiting.length === 1 ? "clip is" : "clips are"} waiting. Approve the ones worth posting and skip the rest.</p>` : ""}
      ${waiting.map(card).join("")}${done.length ? `<h2>Approved, not posted yet</h2>${done.map(card).join("")}` : ""}`;
  },

  post(g) {
    const busy = g.submitNow[0], plat = p => esc(PLATFORM[p.platform] || p.platform);
    let html = `<h1>Post</h1><p class="lede">One at a time: post it, submit it to the campaign, record the receipt. Then the next one.</p>`;
    html += g.submitNow.map(p => {
      const cam = S.campaigns.find(c => c.slug === p.campaign) || {};
      return `<div class="card" style="border-color:var(--red);margin-bottom:14px">
        <div class="row"><div><div class="small mute">Time left to submit</div><div class="count" data-deadline="${esc(p.submit_deadline)}"></div></div>
        <div class="grow"><b style="font-size:17px">Submit your ${plat(p)} post to the campaign</b>
          <div class="small mute">Posted ${when(p.published_at)} · <a href="${safeUrl(p.published_url)}" target="_blank" rel="noopener">see the post</a></div>
          <ol class="steps">
            <li><button class="b ghost" data-act="copy" data-text="${esc(p.published_url)}">Copy the post link</button></li>
            <li><a class="b" href="${safeUrl(cam.campaign_url)}" target="_blank" rel="noopener">Open the campaign page</a> <span class="small mute">Paste the link there and submit.</span></li>
            <li><label for="rc-${esc(p.slug)}">The receipt or submission ID the campaign shows you</label><input id="rc-${esc(p.slug)}" data-receipt="${esc(p.slug)}" placeholder="Paste it here">
              <div class="actions"><button class="b big" data-act="submitted" data-slug="${esc(p.slug)}">Done, I submitted it</button></div></li>
          </ol></div></div></div>`;
    }).join("");
    html += g.ready.map(p => `<div class="card" style="margin-bottom:14px">
        <b style="font-size:17px">Post to ${plat(p)}</b> <span class="small mute">${esc(p.account || "")}</span>
        ${busy ? `<div class="callout"><b>Finish the ${plat(busy)} submission first</b>Posting this now would start a second 30-minute clock.</div>` : ""}
        <ol class="steps">
          <li><button class="b ghost" data-act="copy" data-text="${esc(p.caption)}">Copy the caption</button>
              ${p.platform_title ? `<button class="b ghost" data-act="copy" data-text="${esc(p.platform_title)}">Copy the title</button>` : ""}
              <div class="small mute" style="margin-top:6px">${esc(p.caption)}</div></li>
          <li>${canShareFiles ? `<button class="b ghost" data-act="prepVideo" data-path="${esc(p.media_path || "")}" data-slug="${esc(p.slug)}">Get the video ready</button>
              <button class="b" data-act="shareVideo" data-path="${esc(p.media_path || "")}" data-caption="${esc(p.caption)}" data-ready="${esc(p.slug)}" disabled>Share to the ${plat(p)} app</button>
              <div class="small mute" style="margin-top:6px">Tap the first button and wait, then share into the ${plat(p)} app. Paste the caption and switch on the paid-promotion label before you post.</div>`
            : `<button class="b ghost" data-act="downloadVideo" data-path="${esc(p.media_path || "")}">Download the video</button>
              <a class="b ghost" href="${UPLOAD[p.platform] || "#"}" target="_blank" rel="noopener">Open ${plat(p)} upload</a>
              <div class="small mute" style="margin-top:6px">Upload the file, paste the caption and switch on the paid-promotion label.</div>`}</li>
          <li><label for="pu-${esc(p.slug)}">Once it is live, paste the link to your post</label><input id="pu-${esc(p.slug)}" data-puburl="${esc(p.slug)}" placeholder="https://…" inputmode="url">
              <div class="actions"><button class="b big" data-act="published" data-slug="${esc(p.slug)}" ${busy || me.kind !== "human" ? "disabled" : ""}>It is live</button></div>
              <div class="small mute">This starts the campaign's ${esc(String((S.campaigns.find(c => c.slug === p.campaign) || {}).submit_window_minutes || 30))}-minute submission clock.</div></li>
        </ol></div>`).join("");
    if (!g.submitNow.length && !g.ready.length) html += `<div class="todo"><div class="what"><b>Nothing to post yet</b><span>Clips show up here after you approve them in Review.</span></div><button class="b ghost" data-tab="review">Review</button></div>`;
    if (g.missed.length) html += `<h2>Missed the submission window</h2>` + g.missed.map(p => `<div class="card small" style="margin-bottom:8px">Your <b>${plat(p)}</b> post from ${when(p.published_at)} was never submitted. The window closed ${when(p.submit_deadline)}, so it cannot earn unless the organizer agrees in writing. <a href="${safeUrl(p.published_url)}" target="_blank" rel="noopener">See the post</a></div>`).join("");
    return html;
  },

  more() {
    return `<h1>More</h1><div class="menu">${MORE.map(([id, label, what]) => `<button data-tab="${id}"><span><b>${esc(label)}</b><span class="d">${esc(what)}</span></span><span class="go" aria-hidden="true">›</span></button>`).join("")}</div>
      <div class="actions" style="margin-top:22px"><span class="small mute">Signed in as ${esc(me.display_name)}</span><button class="b ghost" data-act="refresh">Refresh</button><button class="b ghost" data-act="signOut">Sign out</button></div>`;
  },

  make() {
    return `<h1>Make clips</h1><p class="lede">The agents also find new streams and clips by themselves for every streamer listed under a campaign. Use this to hand them something specific.</p>` + (addSource() || `<div class="todo"><div class="what"><b>No streamers yet</b><span>Add a campaign and the streamers it lets you clip first.</span></div><button class="b" data-tab="campaigns">Campaigns</button></div>`);
  },

  style() {
    const st = S.style || STYLE_DEFAULT, opt = (v, cur, label) => `<option value="${esc(v)}" ${String(v) === String(cur) ? "selected" : ""}>${esc(label || v)}</option>`;
    const check = (key, label) => `<label class="check"><input type="checkbox" data-style="${key}" ${st[key] ? "checked" : ""}> ${label}</label>`;
    return `<h1>Caption style</h1><p class="lede">The look of every new clip, for both of you. To change a clip that already exists, use "Fix on-screen words or look" on it in Review.</p>
    <div class="row"><div class="grow card">
      <div class="row">
        <div class="field"><label>Caption font</label><select data-style="font">${Object.keys(FONT_CSS).map(f => opt(f, st.font)).join("")}</select></div>
        <div class="field"><label>Caption size: <span data-show="size">${st.size}</span></label><input type="range" min="60" max="170" step="2" data-style="size" value="${st.size}"></div>
        <div class="field"><label>Words per line</label><select data-style="max_words">${[1, 2, 3, 4, 5].map(n => opt(n, st.max_words)).join("")}</select></div>
      </div>
      <div class="row">
        <div class="field"><label>Text colour</label><input type="color" data-style="color" value="${esc(st.color)}"></div>
        <div class="field"><label>Spoken-word colour</label><input type="color" data-style="highlight" value="${esc(st.highlight)}"></div>
        <div class="field"><label>Outline colour</label><input type="color" data-style="stroke" value="${esc(st.stroke)}"></div>
        <div class="field"><label>Outline thickness</label><input type="range" min="0" max="0.2" step="0.01" data-style="stroke_width" value="${st.stroke_width}"></div>
      </div>
      <div class="row">
        <div class="field"><label>Caption position</label><select data-style="position">
          ${opt("seam", st.position, "Between webcam and gameplay")}${opt("top", st.position, "Top")}${opt("middle", st.position, "Middle")}${opt("lower", st.position, "Lower third")}${opt("bottom", st.position, "Bottom")}</select></div>
        <div class="field"><label>Webcam panel height: <span data-show="webcam_share">${Math.round(st.webcam_share * 100)}%</span></label><input type="range" min="0.22" max="0.50" step="0.01" data-style="webcam_share" value="${st.webcam_share}"></div>
      </div>
      ${check("uppercase", "ALL CAPS")}
      ${check("word_highlight", "Highlight each word as it is spoken")}
      ${check("mask_strong_language", "Mask swearing in captions (slurs are always masked)")}
      ${check("show_disclosure", "Show the campaign's sponsorship label at the start")}
      <p style="margin-top:16px"><button class="b" data-act="saveStyle" ${me.kind !== "human" ? "disabled" : ""}>Save style</button>
        <button class="b ghost" data-act="resetStyle">Back to default</button></p>
    </div>
    <div><div class="phone" id="phone"><div class="cam">webcam</div><div class="game">gameplay</div><div class="cap" id="cap"></div></div>
      <p class="small mute" style="max-width:270px">Preview is approximate. The clip itself is rendered at 1080×1920, up to 60 frames per second.</p></div></div>`;
  },

  queue() {
    const forAgents = j => ["analyze", "render", "ingest"].includes(j.kind) || (j.claimed_agent && j.claimed_agent !== "human");
    const mine = S.jobs.filter(j => !forAgents(j)), theirs = S.jobs.filter(forAgents);
    const who = j => j.state !== "claimed" ? "open" : (j.claimed_agent && j.claimed_agent !== "human" ? "the " + j.claimed_agent + " agent" : name(j.claimed_by)) + " until " + when(j.lease_expires_at);
    return `<h1>To-do list</h1><p class="lede">Jobs for the two of you. The agents' own work is listed underneath and looks after itself.</p>
    <p><button class="b" data-act="claim">Take the next job</button></p>
    <div class="card tablewrap"><table><tr><th>For you</th><th>Due</th><th>Who</th><th></th></tr>
    ${mine.map(j => `<tr><td>${esc(j.title)}${j.payload && j.payload.note ? `<div class="small mute">${esc(j.payload.note)}</div>` : ""}</td>
      <td class="small">${when(j.due_at)}</td><td class="small">${esc(who(j))}</td>
      <td>${j.state === "claimed" && j.claimed_by === me.id && j.claimed_agent === "human" ? `<button class="b" data-act="done" data-id="${j.id}">Done</button> <button class="b ghost" data-act="release" data-id="${j.id}">Give back</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="4" class="mute">Nothing for you right now.</td></tr>`}
    </table></div>
    <h2>The agents are working on</h2>
    <div class="card tablewrap"><table>
    ${theirs.map(j => `<tr><td>${esc(j.title)}</td><td class="small">${j.state === "claimed" ? "in progress" : "waiting its turn"}</td></tr>`).join("") || `<tr><td class="mute">Nothing queued for the agents.</td></tr>`}
    </table></div>
    <h2>Add a job for the two of you</h2><div class="card"><div class="row"><div class="grow"><input id="jobTitle" placeholder="What needs doing" aria-label="What needs doing"></div>
      <div><button class="b" data-act="addJob">Add</button></div></div>
      <p class="small mute" style="margin-bottom:0">To have clips made, use Make clips. Notes written here are for people; the agents do not read them.</p></div>`;
  },

  agents() {
    return `<h1>Agents</h1><p class="lede">Agents run on one of your laptops. They find and make clips. They cannot approve, post or submit; that stays with you.</p>` +
    S.agents.map(a => {
      const seen = a.last_seen_at ? (Date.now() - new Date(a.last_seen_at)) / 60000 : null;
      const health = !a.enabled ? ["off", ""] : seen == null ? ["never run", "warn"] : seen < 30 ? ["running", "ok"] : ["not seen for " + Math.round(seen / 60) + "h", "warn"];
      return `<div class="card" style="margin-bottom:12px"><div class="row"><div class="grow">
        <b style="font-size:17px;text-transform:capitalize">${esc(a.name)}</b> <span class="tag ${health[1]}">${esc(health[0])}</span>
        <div class="small">${esc(a.description)}</div>
        <div class="small mute">${a.last_seen_at ? "Last seen " + when(a.last_seen_at) + " on " + esc(a.last_host) + " · " + esc(a.last_status) : "Has not run yet"}</div>
        ${a.last_error ? `<div class="small" style="color:var(--gold)">Last note: ${esc(a.last_error)}</div>` : ""}</div>
        <div><button class="b ${a.enabled ? "ghost" : ""} switch" data-act="toggleAgent" data-name="${esc(a.name)}" data-on="${a.enabled ? 0 : 1}">${a.enabled ? "Turn off" : "Turn on"}</button></div></div></div>`;
    }).join("");
  },

  campaigns() {
    return `<h1>Campaigns</h1>` + S.campaigns.map(c => {
      const snap = S.snaps.find(s => s.campaign_id === c.id);
      return `<div class="card" style="margin-bottom:12px"><b style="font-size:17px">${esc(c.name)}</b> <span class="tag ${c.status === "active" ? "ok" : ""}">${esc(c.status)}</span>
      <div class="tablewrap"><table>
        <tr><th>Pays</th><td>$${Number(c.rate_usd_per_1000)} per 1,000 eligible views · ${num(c.min_eligible_views)} minimum · $${Number(c.cap_gross_usd)} cap per post · ${Number(c.fee_pct)}% fee</td></tr>
        <tr><th>Submit within</th><td>${c.submit_window_minutes} minutes of publishing</td></tr>
        <tr><th>Closes</th><td>${when(c.closes_at)}</td></tr>
        <tr><th>Platforms</th><td>${(c.platforms || []).map(esc).join(", ")}</td></tr>
        <tr><th>Caption must include</th><td>${(c.caption_must_include || []).map(esc).join(" · ")}</td></tr>
        <tr><th>Budget left</th><td>${snap ? money(snap.remaining_budget_usd) + ", seen " + when(snap.at) : "no snapshot"}</td></tr>
        <tr><th>Terms last checked</th><td>${when(c.terms_checked_at)} <span class="mute">Check the live page before relying on these.</span></td></tr>
      </table></div>
      <p><a class="b ghost" href="${safeUrl(c.campaign_url)}" target="_blank" rel="noopener">Campaign page</a> <a class="b ghost" href="${safeUrl(c.brief_url)}" target="_blank" rel="noopener">Brief</a></p>
      <h2>Streamers you may clip for this campaign</h2>
      <div class="tablewrap"><table><tr><th>Streamer</th><th>Why it is allowed</th><th>Footage from</th><th></th></tr>
      ${S.channels.filter(ch => ch.campaign_id === c.id).map(ch => `<tr><td><b>${esc(ch.slug)}</b> <span class="tag">${esc(ch.platform)}</span></td>
        <td class="small">${esc(ch.permission_basis)}</td><td class="small">${esc(ch.footage_from || "any date")}</td>
        <td><button class="b ghost" data-act="removeChannel" data-id="${ch.id}" data-slug="${esc(ch.slug)}">Remove</button></td></tr>`).join("") || `<tr><td colspan="4" class="mute">No streamers yet.</td></tr>`}
      </table></div>
      <div class="row" style="margin-top:10px">
        <div style="width:120px"><label>Platform</label><select data-ch-platform="${c.id}"><option>kick</option><option>twitch</option><option>youtube</option></select></div>
        <div class="grow"><label>Channel name or link</label><input data-ch-slug="${c.id}" placeholder="e.g. dasgasd3m"></div>
        <div style="width:170px"><label>Footage from (optional)</label><input type="date" data-ch-from="${c.id}"></div>
      </div>
      <label>Where does this campaign say you may clip this streamer?</label>
      <input data-ch-basis="${c.id}" placeholder="Quote or link from the campaign brief">
      <p><button class="b" data-act="addChannel" data-campaign="${c.id}" ${me.kind !== "human" ? "disabled" : ""}>Add streamer</button></p>
      <p class="small mute">A streamer belongs to a campaign because the campaign is what gives permission to use their footage. Clips from streamers not listed here are refused.</p></div>`;
    }).join("") + `
    <details class="card"><summary style="cursor:pointer;font-weight:700">Add a campaign</summary>
      <p class="small mute">Copy the terms from the live campaign page, not from memory.</p>
      <div class="grid">
        <div><label>Name</label><input id="cName" placeholder="Organizer · Streamer or game"></div>
        <div><label>Organizer</label><input id="cOrg"></div>
        <div><label>Campaign page link</label><input id="cUrl" placeholder="https://…"></div>
        <div><label>Brief link</label><input id="cBrief" placeholder="https://…"></div>
        <div><label>Pays per 1,000 eligible views ($)</label><input id="cRate" type="number" step="0.01" min="0"></div>
        <div><label>Minimum eligible views</label><input id="cMin" type="number" min="0" value="0"></div>
        <div><label>Cap per post ($, blank if none)</label><input id="cCap" type="number" step="0.01" min="0"></div>
        <div><label>Platform fee (%)</label><input id="cFee" type="number" step="0.1" min="0" max="100" value="0"></div>
        <div><label>Minutes to submit after publishing (blank if none)</label><input id="cWin" type="number" min="1"></div>
        <div><label>Closes (your local time)</label><input id="cClose" type="datetime-local"></div>
      </div>
      <label>Platforms</label>
      <div class="small"><label style="display:inline;margin-right:14px"><input type="checkbox" id="cYt" checked style="width:auto"> YouTube Shorts</label>
        <label style="display:inline"><input type="checkbox" id="cTt" checked style="width:auto"> TikTok</label></div>
      <label>Text every caption must include, separated by commas</label><input id="cMust" placeholder="Sponsored, streamername, kick.com/streamername, #hashtag">
      <label>Caption template ({hook} is replaced by the clip's line)</label><input id="cTpl" placeholder="Sponsored by X. {hook} Watch Y on Kick: kick.com/y #tag">
      <label>On-screen disclosure at the start of the video (blank if not required)</label><input id="cDisc" placeholder="Sponsored by X">
      <p><button class="b" data-act="addCampaign" ${me.kind !== "human" ? "disabled" : ""}>Add campaign</button></p>
    </details>`;
  },

  earnings() {
    return `<h1>Earnings</h1><div class="card tablewrap"><table>
      <tr><th>Post</th><th>State</th><th>Views</th><th>Eligible views</th><th>Estimate after fee</th><th>Approved</th><th>Paid</th></tr>
      ${S.posts.filter(p => p.published_at).map(p => `<tr><td><a href="${safeUrl(p.published_url)}" target="_blank" rel="noopener">${esc(PLATFORM[p.platform] || p.platform)} post</a><div class="small mute">posted ${when(p.published_at)}</div></td>
        <td>${p.window_missed ? `<span class="tag bad">missed window</span>` : `<span class="tag">${esc(p.state)}</span>`}${p.submission_id ? `<div class="mono mute">${esc(p.submission_id)}</div>` : ""}</td>
        <td>${num(p.views)}</td><td>${num(p.eligible_views)}</td><td>${money(p.est_after_fee_usd)}</td><td>${money(p.approved_usd)}</td><td>${money(p.paid_usd)}</td></tr>`).join("") || `<tr><td colspan="7" class="mute">No published posts.</td></tr>`}
    </table></div><p class="small mute">A dash means nothing has been recorded. Public views never produce an estimate; only eligible views reported by the campaign do.</p>`;
  },

  history() {
    return `<h1>History</h1><div class="card tablewrap"><table><tr><th>When</th><th>Who</th><th>What</th></tr>
    ${S.events.map(e => { const row = e.after || e.before || {}; const label = row.slug || row.title || row.short_id || row.name || "";
      const change = e.action === "update" && e.before && e.after && e.before.state !== e.after.state ? ` → ${esc(e.after.state)}` : "";
      return `<tr><td class="small">${when(e.at)}</td><td class="small">${esc(name(e.actor))}</td><td>${esc(e.action)} ${esc(e.entity)} <span class="mono">${esc(label)}</span>${change}</td></tr>`; }).join("")}
    </table></div>`;
  },
};

function readStyle() {
  const st = Object.assign({}, STYLE_DEFAULT, S.style || {});
  document.querySelectorAll("[data-style]").forEach(el => {
    const key = el.dataset.style;
    st[key] = el.type === "checkbox" ? el.checked : (el.type === "range" || key === "max_words") ? Number(el.value) : el.value;
  });
  return st;
}
function drawPreview() {
  const phone = $("#phone"); if (!phone) return;
  const st = readStyle(), scale = 270 / 1080, camH = Math.round(480 * st.webcam_share);
  phone.querySelector(".cam").style.height = camH + "px";
  phone.querySelector(".game").style.height = (480 - camH) + "px";
  const centre = {seam: camH, top: 480 * 0.16, middle: 240, lower: 480 * 0.66, bottom: 480 * 0.80}[st.position] ?? camH;
  const words = ["He", "just", "had", "to", "park"].slice(0, st.max_words), size = st.size * scale;
  const cap = $("#cap");
  const hex = (v, d) => /^#[0-9a-fA-F]{6}$/.test(v || "") ? v : d;      // settings come from the database: accept only plain colours
  cap.style.cssText = `top:${Number(centre)}px;font-family:${FONT_CSS[st.font] || "Anton"},Impact,sans-serif;font-size:${Number(size)}px;color:${hex(st.color, "#FFFFFF")};-webkit-text-stroke:${(size * Number(st.stroke_width) * 2).toFixed(1)}px ${hex(st.stroke, "#000000")};font-weight:${st.font === "Poppins" ? 800 : 400}`;
  cap.innerHTML = words.map((w, i) => `<span style="${st.word_highlight && i === Math.min(1, words.length - 1) ? "color:" + hex(st.highlight, "#FFE14D") : ""}">${st.uppercase ? w.toUpperCase() : w}</span>`).join(" ");
  document.querySelectorAll("[data-show]").forEach(el => { const v = st[el.dataset.show]; el.textContent = el.dataset.show === "webcam_share" ? Math.round(v * 100) + "%" : v; });
}
document.addEventListener("input", e => { if (e.target.matches("[data-style]")) drawPreview(); });

function addSource() {
  if (!S.channels.length) return "";
  return `<div class="card"><div class="row">
    <div class="grow"><label>Link (Kick, Twitch or YouTube)</label><input id="srcUrl" placeholder="https://…"></div>
    <div style="width:190px"><label>This link is</label><select id="srcKind"><option value="clip">one short clip</option><option value="stream">a full stream recording</option></select></div>
    <div style="width:150px"><label>Streamer</label><select id="srcChannel">${S.channels.map(c => `<option value="${c.id}">${esc(c.slug)}</option>`).join("")}</select></div>
    <div style="width:120px"><label>Clips to make</label><select id="srcClips"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>8</option></select></div>
    </div><p><button class="b" data-act="addSource">Queue it</button></p>
    <label for="srcFile">Or upload a video from this device (up to 50 MB)</label>
    <input type="file" id="srcFile" accept="video/*">
    <p><button class="b ghost" data-act="uploadSource">Upload and queue it</button> <span class="small mute" id="uploadMsg"></span></p>
    <p class="small mute">A clip goes straight to the Editor. For a full stream, the Spotter first finds its loudest separate moments (plus chat spikes on YouTube) and the Editor cuts each one; "Clips to make" applies to streams. Loud is not always good: every result still waits here for your review. Only streamers a partner has authorized are listed, and an agent laptop must be running.</p></div>`;
}

async function loadVideos() {
  for (const v of document.querySelectorAll("video[data-media]")) {
    const path = v.dataset.media, note = v.parentElement.querySelector("[data-medianote]");
    if (!path.startsWith("masters/")) { note.textContent = path ? "File is on a laptop, not in shared storage: " + path : "No file recorded"; continue; }
    if (!videoUrls[path]) {
      const {data, error} = await db.storage.from("masters").createSignedUrl(path.slice(8), 3600);
      if (error) { note.textContent = "Could not load the file: " + error.message; continue; }
      videoUrls[path] = data.signedUrl;
    }
    if (v.src !== videoUrls[path]) v.src = videoUrls[path];
  }
}

const ACTIONS = {
  async approve(d) { await call(db.rpc("review_post", {p_slug: d.slug, p_decision: "approve"}), "Approved"); },
  async approveClip(d) {
    const group = clipGroups().find(c => c.clip === d.clip); if (!group) return;
    const box = $(`[data-caption="${CSS.escape(d.clip)}"]`);
    if (box && box.value !== group.first.caption) {                 // an edited caption is saved before it is approved
      const saved = await db.from("clips").update({caption: box.value}).eq("short_id", d.clip);
      if (saved.error) return toast(saved.error.message, true);
    }
    for (const p of group.waiting) {
      const {error} = await db.rpc("review_post", {p_slug: p.slug, p_decision: "approve"});
      if (error) { toast(error.message, true); return load(); }
    }
    toast("Approved. It is ready under Post."); await load();
  },
  async skipClip(d) {
    const group = clipGroups().find(c => c.clip === d.clip); if (!group) return;
    if (!confirm("Skip this clip? It leaves Review and will not be posted.")) return;
    const {error} = await db.from("posts").update({state: "withdrawn"}).in("slug", group.posts.map(p => p.slug));
    if (error) return toast(error.message, true);
    await db.from("jobs").update({state: "cancelled"}).eq("kind", "review").eq("state", "queued").contains("payload", {clip: d.clip});
    toast("Skipped"); await load();
  },
  refresh() { load().then(() => toast("Up to date")); },
  async signOut() { await db.auth.signOut(); location.reload(); },
  async revise(d) { const note = prompt("What needs to change?"); if (note) await call(db.rpc("review_post", {p_slug: d.slug, p_decision: "revise", p_note: note}), "Sent back"); },
  async saveCaption(d) { const text = $(`[data-caption="${CSS.escape(d.clip)}"]`).value; await call(db.from("clips").update({caption: text}).eq("short_id", d.clip), "Caption saved"); },
  async copy(d) { try { await navigator.clipboard.writeText(d.text); toast("Copied"); } catch { toast("Copy failed; select the text by hand", true); } },
  async published(d) {
    const url = $(`[data-puburl="${CSS.escape(d.slug)}"]`).value.trim();
    if (!/^https:\/\//.test(url)) return toast("Paste the public https:// link of the live post first", true);
    if (!confirm("Is this post public right now?\n\n" + url + "\n\nThis starts the submission clock.")) return;
    if (await call(db.rpc("record_published", {p_slug: d.slug, p_url: url, p_at: new Date().toISOString()}), "Clock started. Submit it to the campaign now.")) { tab = "post"; render(); }
  },
  async submitted(d) {
    const receipt = $(`[data-receipt="${CSS.escape(d.slug)}"]`).value.trim();
    if (!receipt) return toast("Paste the receipt the campaign page showed you", true);
    await call(db.rpc("record_submitted", {p_slug: d.slug, p_receipt: receipt, p_at: new Date().toISOString()}), "Receipt recorded");
  },
  async saveStyle() { const st = readStyle(); if (await call(db.from("settings").upsert({key: "style", value: st, updated_at: new Date().toISOString()}), "Style saved. New clips will use it.")) S.style = st; },
  async resetStyle() { S.style = Object.assign({}, STYLE_DEFAULT); render(); toast("Default look loaded. Press Save style to keep it."); },
  async openRedo(d) {
    const box = $(`[data-redo="${CSS.escape(d.clip)}"]`);
    if (box.innerHTML) { box.innerHTML = ""; redoOpen = false; return; }
    const {data: clip, error} = await db.from("clips").select("id,short_id,source_id,edit").eq("short_id", d.clip).single();
    if (error) return toast(error.message, true);
    if (!clip.edit || !(clip.edit.captions || []).length) return toast("This clip was made before caption editing existed. Send it back and queue its link again.", true);
    redoOpen = true;
    box.innerHTML = `<div class="card" style="margin-top:12px;background:var(--panel2)"><b>On-screen captions</b>
      <p class="small mute">Fix any word the transcript got wrong. Empty a line to remove it. Timing is kept.</p>
      ${clip.edit.captions.map((c, i) => `<div class="row" style="align-items:center;margin-bottom:6px"><span class="small mute" style="width:52px">${Number(c.start).toFixed(1)}s</span><div class="grow"><input data-line="${i}" value="${esc(c.text)}"></div></div>`).join("")}
      <label class="check"><input type="checkbox" data-redo-rechunk> Regroup the words to the "words per line" set in Style</label>
      <label class="check"><input type="checkbox" data-redo-nocam> Gameplay only (hide the webcam panel)</label>
      <p style="margin-top:12px"><button class="b" data-act="redo" data-clip="${esc(clip.short_id)}">Re-render with these captions and the current Style</button></p>
      <p class="small mute">This version leaves Review now. The new one appears when the Editor agent finishes, usually in a couple of minutes.</p></div>`;
    box._clip = clip;
  },
  async redo(d) {
    const box = $(`[data-redo="${CSS.escape(d.clip)}"]`), clip = box._clip, e = clip.edit;
    const captions = [];
    e.captions.forEach((c, i) => {
      const words = box.querySelector(`[data-line="${i}"]`).value.trim().split(/\s+/).filter(Boolean);
      if (!words.length) return;
      const old = c.words || [];
      const timed = words.length === old.length ? words.map((w, k) => [old[k][0], old[k][1], w])
        : words.map((w, k) => [+(c.start + (c.end - c.start) * k / words.length).toFixed(3), +(c.start + (c.end - c.start) * (k + 1) / words.length).toFixed(3), w]);
      captions.push({start: c.start, end: c.end, text: words.join(" "), words: timed});
    });
    const post = S.posts.find(p => p.clip === d.clip) || {};
    const edit = {ranges: e.ranges, layout: box.querySelector("[data-redo-nocam]").checked ? {} : e.layout, captions,
      style: S.style, hook: e.hook, language: e.language, rechunk: box.querySelector("[data-redo-rechunk]").checked};
    const payload = {source_id: clip.source_id, redo_clip: clip.short_id, edit, post_caption: post.caption || null};
    if (e.section) payload.section = e.section;
    const {error} = await db.from("jobs").insert({kind: "render", source_id: clip.source_id, priority: 66, title: "Re-render clip " + clip.short_id, payload});
    if (error) return toast(error.message, true);
    const slugs = S.posts.filter(p => p.clip === d.clip && ["draft", "in_review", "approved"].includes(p.state)).map(p => p.slug);
    if (slugs.length) await db.from("posts").update({state: "withdrawn"}).in("slug", slugs);
    await db.from("jobs").update({state: "cancelled"}).eq("kind", "review").eq("state", "queued").contains("payload", {clip: clip.short_id});
    redoOpen = false; toast("Queued. The new version will appear in Review."); await load();
  },
  async prepVideo(d) {
    if (!d.path.startsWith("masters/")) return toast("This clip's file is not in shared storage", true);
    toast("Getting the video ready…");
    const {data, error} = await db.storage.from("masters").download(d.path.slice(8));
    if (error) return toast(error.message, true);
    videoFiles[d.path] = new File([data], "leonida-" + d.slug + ".mp4", {type: "video/mp4"});
    document.querySelectorAll(`[data-ready="${CSS.escape(d.slug)}"]`).forEach(b => b.disabled = false);
    toast("Ready. Tap Share.");
  },
  shareVideo(d) {                                         // no awaits before share(): phones require it on the tap
    const file = videoFiles[d.path];
    if (!file) return toast("Tap 'Get the video ready' first", true);
    navigator.clipboard && navigator.clipboard.writeText(d.caption || "").catch(() => {});
    navigator.share({files: [file]}).then(() => toast("Shared. Paste the caption, post, then paste the public link below."))
      .catch(e => { if (e.name !== "AbortError") toast("Sharing failed: " + e.message, true); });
  },
  async downloadVideo(d) {
    if (!d.path.startsWith("masters/")) return toast("This clip's file is not in shared storage", true);
    const {data, error} = await db.storage.from("masters").createSignedUrl(d.path.slice(8), 600, {download: true});
    if (error) return toast(error.message, true);
    location.href = data.signedUrl;
  },
  async uploadSource() {
    const file = $("#srcFile").files[0], ch = S.channels.find(c => c.id === $("#srcChannel").value), msg = $("#uploadMsg");
    if (!file || !ch) return toast("Choose a video file and a streamer", true);
    if (file.size > 50 * 1024 * 1024) return toast("That file is " + Math.round(file.size / 1048576) + " MB. Free storage takes up to 50 MB per file.", true);
    if (!file.type.startsWith("video/")) return toast("That is not a video file", true);
    const safe = file.name.replace(/[^A-Za-z0-9._-]+/g, "_").slice(-60), path = crypto.randomUUID() + "/" + safe;
    msg.textContent = "Uploading…";
    const up = await db.storage.from("uploads").upload(path, file, {contentType: file.type});
    if (up.error) { msg.textContent = ""; return toast(up.error.message, true); }
    const {data, error} = await db.from("sources").insert({campaign_id: ch.campaign_id, channel_id: ch.id, creator: ch.slug, title: file.name.slice(0, 120),
      permission_basis: ch.permission_basis, status: "queued", note: "uploaded from a partner's device"}).select().single();
    if (error) { msg.textContent = ""; return toast(error.message, true); }
    msg.textContent = "";
    await call(db.from("jobs").insert({kind: "render", source_id: data.id, priority: 61, title: "Edit uploaded " + ch.slug + " video: " + file.name.slice(0, 60),
      payload: {source_id: data.id, storage: "uploads/" + path}}), "Uploaded and queued for the Editor");
  },
  async claim() { const jobs = await call(db.rpc("claim_job", {p_agent: "human", p_kinds: ["other", "metrics", "review", "publish", "submit"]})); if (jobs && !jobs.length) toast("Nothing to take"); },
  async done(d) { await call(db.rpc("finish_job", {p_id: d.id, p_ok: true}), "Done"); },
  async release(d) { await call(db.rpc("release_job", {p_id: d.id}), "Back in the queue"); },
  async addJob() { const title = $("#jobTitle").value.trim(); if (title) await call(db.from("jobs").insert({title, kind: "other"}), "Added"); },
  async toggleAgent(d) { await call(db.from("agents").update({enabled: d.on === "1"}).eq("name", d.name), d.name + (d.on === "1" ? " on" : " off")); },
  async addChannel(d) {
    const q = k => $(`[data-ch-${k}="${CSS.escape(d.campaign)}"]`).value.trim();
    const slug = q("slug").replace(/^https?:\/\/(www\.)?[a-z.]+\//i, "").replace(/^@/, "").split(/[\/?#]/)[0].toLowerCase();
    const basis = q("basis");
    if (!/^[a-z0-9_.-]{2,60}$/.test(slug)) return toast("Enter the streamer's channel name, e.g. dasgasd3m", true);
    if (basis.length < 10) return toast("Say where the campaign allows clipping this streamer: a quote or a link from the brief", true);
    await call(db.from("channels").upsert({campaign_id: d.campaign, platform: q("platform"), slug, permission_basis: basis,
      footage_from: q("from") || null, active: true}, {onConflict: "campaign_id,platform,slug"}), "Added " + slug);
  },
  async removeChannel(d) {
    if (confirm("Stop accepting clips from " + d.slug + "? Existing clips are kept."))
      await call(db.from("channels").update({active: false}).eq("id", d.id), "Removed " + d.slug);
  },
  async addCampaign() {
    const v = id => $("#" + id).value.trim(), n = id => v(id) === "" ? null : Number(v(id));
    const name = v("cName"), rate = n("cRate");
    if (name.length < 3) return toast("Give the campaign a name", true);
    if (rate == null || !(rate >= 0)) return toast("Enter what the campaign pays per 1,000 eligible views", true);
    for (const id of ["cUrl", "cBrief"]) if (v(id) && !/^https:\/\//.test(v(id))) return toast("Links must start with https://", true);
    const platforms = [$("#cYt").checked && "youtube", $("#cTt").checked && "tiktok"].filter(Boolean);
    if (!platforms.length) return toast("Pick at least one platform", true);
    const slug = name.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const row = {slug, name, organizer: v("cOrg") || null, campaign_url: v("cUrl") || null, brief_url: v("cBrief") || null,
      rate_usd_per_1000: rate, min_eligible_views: n("cMin") ?? 0, cap_gross_usd: n("cCap"), fee_pct: n("cFee") ?? 0,
      submit_window_minutes: n("cWin"), closes_at: v("cClose") ? new Date(v("cClose")).toISOString() : null, platforms,
      caption_must_include: v("cMust").split(",").map(x => x.trim()).filter(Boolean),
      caption_template: v("cTpl") || null, video_disclosure: v("cDisc") || null,
      terms_checked_at: new Date().toISOString(), terms_evidence: v("cUrl") || "entered on the dashboard"};
    const {error} = await db.from("campaigns").insert(row);
    if (error) return toast(error.message.includes("campaigns_slug_key") ? "A campaign with that name already exists" : error.message, true);
    toast("Campaign added. Now add the streamers it lets you clip."); await load();
  },
  async addSource() {
    const url = $("#srcUrl").value.trim(), ch = S.channels.find(c => c.id === $("#srcChannel").value);
    if (!/^https:\/\//.test(url) || !ch) return toast("Paste an https:// clip link", true);
    const stream = $("#srcKind").value === "stream", clips = Number($("#srcClips").value);
    const row = {campaign_id: ch.campaign_id, channel_id: ch.id, creator: ch.slug, permission_basis: ch.permission_basis, status: "queued"};
    row[stream ? "vod_url" : "clip_url"] = url;
    const {data, error} = await db.from("sources").insert(row).select().single();
    if (error) return toast(error.message.includes("sources_clip_url") ? "That clip is already in the inbox" : error.message, true);
    const job = stream
      ? {kind: "analyze", source_id: data.id, priority: 62, title: "Find " + clips + " moments in " + ch.slug + " stream: " + url, payload: {source_id: data.id, clips}}
      : {kind: "render", source_id: data.id, priority: 60, title: "Edit " + ch.slug + " clip: " + url, payload: {source_id: data.id}};
    await call(db.from("jobs").insert(job), stream ? "Queued for the Spotter" : "Queued for the Editor");
  },
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; redoOpen = false; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-act]"); if (a && !a.disabled) ACTIONS[a.dataset.act](a.dataset);
});
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginMsg").textContent = "Signing in…";
  const {data, error} = await db.auth.signInWithPassword({email: $("#email").value.trim(), password: $("#password").value});
  if (error) { $("#loginMsg").textContent = error.message; return; }
  $("#password").value = ""; $("#loginMsg").textContent = ""; enter(data.session);
};
$("#signup").onclick = async () => {
  const email = $("#email").value.trim(), password = $("#password").value;
  if (!email || password.length < 10) { $("#loginMsg").textContent = "Enter your invited email and a password of at least 10 characters, then press this button again."; return; }
  $("#loginMsg").textContent = "Creating your login…";
  const {data, error} = await db.auth.signUp({email, password, options: {emailRedirectTo: location.origin + location.pathname}});
  if (error) { $("#loginMsg").textContent = error.message; return; }
  $("#password").value = "";
  if (data.session) { enter(data.session); return; }
  $("#loginMsg").textContent = "Check your inbox for a confirmation email from Supabase and click its link. Then come back here and sign in.";
};
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
start();
